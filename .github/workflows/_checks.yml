name: checks
on:
  workflow_call: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install 3.10
      - run: uv python pin 3.10
      - run: just install lint-ci

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # --offline blocks network requests and excludes every external URL, so this gate
      # is deterministic: it fails only on a relative link or file path a diff broke.
      # Tag-pinned and cross-repo URLs do not match the --remap pattern and stay
      # excluded: they point at trees this checkout does not have.
      - name: Check local links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline
            --no-progress
            --remap
            'https://github\.com/${{ github.repository }}/(?:blob|tree)/main/(.*) file://${{ github.workspace }}/$1'
            '**/*.md'

  floors:
    # The declared dependency floors, installed. Every other job resolves highest, so the
    # bottom of the range is otherwise never exercised and can rot unnoticed -- a PyYAML
    # floor that could not build on 3.14 shipped for exactly that reason (issue 126).
    # Binary-only, because the pitch is minimal images: a floor reachable only by
    # compiling an sdist is not a floor a user of one can install.
    # 3.14t is out: no PyYAML release ships a cp314t wheel, so that job would measure
    # upstream's gap rather than this repo's floor.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv venv --python ${{ matrix.python-version }}
      - run: uv pip install --resolution lowest-direct --only-binary PyYAML ".[yaml]"
      - run: uv run --no-project python -c "import compose2pod, yaml; print(yaml.__version__)"

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.14t"]
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install ${{ matrix.python-version }}
      - run: uv python pin ${{ matrix.python-version }}
      - run: just install
      - name: Confirm the interpreter is free-threaded
        if: matrix.python-version == '3.14t'
        run: uv run --no-sync python -c "import sys, compose2pod; assert not sys._is_gil_enabled(), 'GIL is enabled on a t-build'"
      - run: just test-ci

  integration:
    # Pinned to the runner that ships the supported podman floor (4.9.x, ADR-0006).
    # On ubuntu-latest this job would measure whatever podman the newest image carries,
    # which is not the version a document has to run on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install 3.12
      - run: uv python pin 3.12
      - run: just install
      - run: podman --version
      - run: just test-integration

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"
      - run: uv python install 3.12
      - run: uv python pin 3.12
      - run: just install
      - run: docker compose version
      - run: just test-conformance
