[project]
name = "compose2pod"
description = "Convert a Docker Compose file into a script that runs its services as a single Podman pod"
authors = [{ name = "Artur Shiriev", email = "me@shiriev.ru" }]
requires-python = ">=3.10,<4"
license = "MIT"
readme = "README.md"
keywords = ["podman", "docker-compose", "docker", "containers", "cli", "python"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Testing",
]
version = "0"

[project.optional-dependencies]
# Split per interpreter because PyYAML's wheel coverage is: 6.0.1 is the first with a cp312
# wheel, 6.0.2 the first with cp313 and 6.0.3 the first with cp314, whose sdist 6.0 cannot
# build. An older interpreter has no reason to lose the lower floor.
yaml = [
    "PyYAML>=6; python_version < '3.12'",
    "PyYAML>=6.0.1; python_version == '3.12'",
    "PyYAML>=6.0.2; python_version == '3.13'",
    "PyYAML>=6.0.3; python_version >= '3.14'",
]

[project.scripts]
compose2pod = "compose2pod.cli:main"

[project.urls]
Homepage = "https://modern-python.org"
Repository = "https://github.com/modern-python/compose2pod"
Issues = "https://github.com/modern-python/compose2pod/issues"
Changelog = "https://github.com/modern-python/compose2pod/releases"

[build-system]
requires = ["uv_build>=0.11,<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "compose2pod"
module-root = ""

[dependency-groups]
dev = [
    "packaging",
    "pytest",
    "pytest-cov",
    "tomli",
]
lint = [
    "ruff",
    "ty",
    "eof-fixer",
    "typing-extensions",
    "types-PyYAML",
]

[tool.ruff]
fix = true
unsafe-fixes = true
line-length = 120

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D1",     # docstrings are not forced; a docstring exists when it says something
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "COM812", # conflicts with the formatter
    "ISC001", # conflicts with the formatter
    "CPY001", # no per-file copyright header
    "FBT",    # boolean positional arguments are fine
    "TCH",    # imports stay real; TYPE_CHECKING-only imports break runtime introspection
]
isort.lines-after-imports = 2
isort.no-lines-before = ["standard-library", "local-folder"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
addopts = "-m 'not integration and not conformance'"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: end-to-end tests that execute generated scripts against real podman (CI-only)",
    "conformance: differential tests asserting compose2pod refuses whatever `docker compose config` refuses (CI-only; needs the docker CLI, no daemon)",
]

[tool.coverage]
report.exclude_also = ["if typing.TYPE_CHECKING:"]
# The __main__.py shim is a pure `sys.exit(main())` entrypoint exercised only via
# subprocess (tests/test_cli.py::test_python_m_runs), which the parent coverage process
# can't measure; omit it rather than enable subprocess/branch coverage machinery.
# tests/integration/* only runs in the dedicated podman CI job, never in the gated run.
run.omit = ["compose2pod/__main__.py", "tests/integration/*", "tests/conformance/*"]
report.fail_under = 100
